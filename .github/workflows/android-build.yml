name: CS Personal Engine — Android CI & Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_offline:
        description: 'Also build the full offline-bundled APK (~840 MB runtime assets)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cs-personal-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ANDROID_NDK_VERSION: '28.2.13676358'
  RUNTIME_RELEASE_BASE: 'https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4'

jobs:
  build-apk:
    name: Test, Native NDK Compile & Build Signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository & native PRoot/shmem submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Temurin JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install zstd & Android SDK / NDK ${{ env.ANDROID_NDK_VERSION }} / CMake ${{ env.ANDROID_CMAKE_VERSION }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd curl python3
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Cache shared runtime asset bundle
        id: cache-agy-bundle
        uses: actions/cache@v4
        with:
          path: dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst
          key: cs-engine-agy-bundle-2026.09.1-a659ab91

      - name: Fetch & verify bundled ARM64 agent runtime asset
        run: |
          mkdir -p dist/runtime-bundles
          AGY_FILE="dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst"
          EXPECTED_SHA="a659ab9188956fc4721ca86fb21b5118e0e489f47a5e02ae6b4f2fb423659d78"

          verify_agy() {
            [[ -f "$AGY_FILE" ]] && [[ "$(sha256sum "$AGY_FILE" | awk '{print $1}')" == "$EXPECTED_SHA" ]]
          }

          if ! verify_agy; then
            echo "Downloading $AGY_FILE from runtime release..."
            if ! curl -fL --retry 3 -o "$AGY_FILE" "${RUNTIME_RELEASE_BASE}/pocketdev-agy-arm64-2026.09.1.tar.zst" || ! verify_agy; then
              echo "Falling back to deterministic official build script..."
              chmod +x scripts/runtime-bundles/build-agy-from-official.sh
              ./scripts/runtime-bundles/build-agy-from-official.sh
            fi
          fi
          echo "${EXPECTED_SHA}  ${AGY_FILE}" | sha256sum -c -

      - name: Fetch & verify offline runtime bundles (optional)
        if: ${{ inputs.build_offline == true }}
        run: |
          mkdir -p dist/runtime-bundles
          declare -A BUNDLES=(
            ["pocketdev-core-arm64-2026.09.5.tar.zst"]="df0cf7251c74f82d424231e3804114a4ca66b16130eea9abab11e220dc7ac012"
            ["pocketdev-claude-arm64-2026.09.1.tar.zst"]="0f68e15630e8c0fc941afe3f61ab5a3eb4407b334018de6dbdabfa5eca627724"
            ["pocketdev-python-arm64-2026.09.2.tar.zst"]="6b3f56f7743fec142bc045db3ea561ee83fe89af87c2799165ef60351164ef85"
            ["pocketdev-android-arm64-2026.09.1.tar.zst"]="01bea058ebcb17416d1eb08c0211b3782da3228eb3c8348eb3719f2d61dd3ec6"
            ["pocketdev-dsh-arm64-2026.09.1.tar.zst"]="88e6a23ba74e1cd74a2c923b7e0d6bd78ba4b7e5f8a9b649f12bf4ffe158cce5"
          )
          for FILE in "${!BUNDLES[@]}"; do
            DEST="dist/runtime-bundles/${FILE}"
            curl -fL --retry 3 -o "$DEST" "${RUNTIME_RELEASE_BASE}/${FILE}"
            echo "${BUNDLES[$FILE]}  ${DEST}" | sha256sum -c -
          done

      - name: Run Unit Test Suite
        run: ./gradlew testOnlineDebugUnitTest --stacktrace

      - name: Prepare Release Signing Keystore
        id: signing
        env:
          CS_KEYSTORE_BASE64: ${{ secrets.CS_KEYSTORE_BASE64 }}
          CS_KEYSTORE_PASSWORD: ${{ secrets.CS_KEYSTORE_PASSWORD }}
          CS_KEY_ALIAS: ${{ secrets.CS_KEY_ALIAS }}
          CS_KEY_PASSWORD: ${{ secrets.CS_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="cs-release-keystore.jks"
          if [[ -n "$CS_KEYSTORE_BASE64" && -n "$CS_KEYSTORE_PASSWORD" && -n "$CS_KEY_ALIAS" && -n "$CS_KEY_PASSWORD" ]]; then
            echo "Using repository release signing keystore secret."
            printf '%s' "$CS_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "MH_UPLOAD_STORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "MH_UPLOAD_STORE_PASSWORD=$CS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MH_UPLOAD_KEY_ALIAS=$CS_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MH_UPLOAD_KEY_PASSWORD=$CS_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No custom signing secrets configured; generating CI release signing key so APKs are immediately installable."
            CI_PASS="cs-engine-ci-signing-2026"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias cs-engine \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=CS Personal Engine, OU=Engineering, O=CS Personal Engine, L=Global, S=Global, C=US"
            echo "MH_UPLOAD_STORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "MH_UPLOAD_STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "MH_UPLOAD_KEY_ALIAS=cs-engine" >> "$GITHUB_ENV"
            echo "MH_UPLOAD_KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Build Signed CS Personal Engine APKs (Online Debug & Release)
        run: |
          ./gradlew assembleOnlineDebug assembleOnlineRelease --stacktrace
          if [[ "${{ inputs.build_offline }}" == "true" ]]; then
            ./gradlew assembleOfflineRelease --stacktrace
          fi

      - name: Collect & Checksum APK Deliverables
        run: |
          mkdir -p dist/apks
          VERSION_TAG="${GITHUB_REF_NAME:-v2.0.0}"
          cp app/build/outputs/apk/online/release/app-online-release.apk \
            "dist/apks/CS-Personal-Engine-${VERSION_TAG}-arm64-online-release.apk"
          cp app/build/outputs/apk/online/debug/app-online-debug.apk \
            "dist/apks/CS-Personal-Engine-${VERSION_TAG}-arm64-online-debug.apk"
          if [[ -f app/build/outputs/apk/offline/release/app-offline-release.apk ]]; then
            cp app/build/outputs/apk/offline/release/app-offline-release.apk \
              "dist/apks/CS-Personal-Engine-${VERSION_TAG}-arm64-offline-release.apk"
          fi
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            REL_APK="dist/apks/CS-Personal-Engine-${VERSION_TAG}-arm64-online-release.apk"
            REL_SHA="$(sha256sum "$REL_APK" | awk '{print $1}')"
            REL_SIZE="$(wc -c < "$REL_APK" | tr -d ' ')"
            DL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION_TAG}/CS-Personal-Engine-${VERSION_TAG}-arm64-online-release.apk"
            cat > dist/apks/cs-personal-engine-update.json <<JSON
          {
            "versionCode": 20,
            "versionName": "${VERSION_TAG#v}",
            "notes": "CS Personal Engine ${VERSION_TAG} release build.",
            "artifacts": {
              "online": {
                "url": "${DL_URL}",
                "sha256": "${REL_SHA}",
                "sizeBytes": ${REL_SIZE}
              }
            }
          }
          JSON
          fi
          (cd dist/apks && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/apks/
          cat dist/apks/SHA256SUMS.txt
          rm -f cs-release-keystore.jks

      - name: Upload Installable APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CS-Personal-Engine-APKs-${{ github.sha }}
          path: dist/apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/apks/*
